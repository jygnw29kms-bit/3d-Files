name: Deploy PRINTBENCH 3D Druck

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.php'
      - 'index.html'
      - 'api.php'
      - 'site.css'
      - 'hightech.css'
      - 'site.js'
      - 'workbench.js'
      - 'Druckkosten-Rechner/**'
      - 'LST-Klammer/**'
      - 'LST-Clips/**'
      - '.github/workflows/deploy-3d-druck.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate PHP
        run: |
          php -l index.php
          php -l api.php

      - name: Build deploy tree
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.php index.html api.php site.css hightech.css site.js workbench.js dist/
          cp -a Druckkosten-Rechner LST-Klammer LST-Clips dist/

      - name: Deploy to dezender.de/3d-druck
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: '/var/www/vhosts/dezender.de/httpdocs/3d-druck/'
          delete_remote_files: true

      - name: Smoke test
        run: |
          sleep 4
          curl --fail --retry 5 --retry-delay 3 https://www.dezender.de/3d-druck/index.php | grep -q 'PRINTBENCH'
          curl --fail --retry 5 --retry-delay 3 https://www.dezender.de/3d-druck/api.php | grep -q 'PRINTBENCH'
