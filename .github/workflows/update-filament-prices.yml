name: Update filament prices
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python Druckkosten-Rechner/scripts/update_prices.py
      - name: Commit changed catalog
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Druckkosten-Rechner/data/filaments.json
          git commit -m "Update filament market prices"
          git push
