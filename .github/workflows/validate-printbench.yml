name: Validate PRINTBENCH

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  contract-and-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest paho-mqtt requests watchdog
      - name: Validate product contract
        run: python tools/validate_product_contract.py
      - name: Test PRINTBENCH boundaries and control engine
        run: >-
          python -m pytest -q
          tests/test_external_tag.py
          tests/test_reader_contract.py
          tests/test_reader_serial.py
          tests/test_command_engine.py
          tests/test_control_security.py
          tests/test_device_info.py
          tests/test_master_ui.py
          tests/test_native_final_master_contract.py
          tests/test_windows_build_contract.py
      - name: Check Pi Python syntax
        run: |
          python -m py_compile \
            tools/printbench_collector/camera_bridge.py \
            tools/printbench_collector/reader_contract.py \
            tools/printbench_collector/reader_serial.py \
            tools/printbench_collector/external_tag.py \
            tools/printbench_collector/bambu_tls.py \
            tools/printbench_collector/command_engine.py \
            tools/printbench_collector/control_cli.py \
            tools/printbench_collector/pin_printer_certificate.py \
            tools/printbench_collector/pi_ui/server.py
      - name: Check Pi UI JavaScript
        run: node --check tools/printbench_collector/pi_ui/static/app.js
      - name: Validate Pi UI DOM ids
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]
              def handle_starttag(self, tag, attrs):
                  self.ids.extend(v for k,v in attrs if k == 'id')
          p=Parser(); p.feed(Path('tools/printbench_collector/pi_ui/static/index.html').read_text(encoding='utf-8'))
          dup=sorted({x for x in p.ids if p.ids.count(x)>1})
          if dup: raise SystemExit(f'duplicate DOM ids: {dup}')
          print(f'validated {len(p.ids)} unique DOM ids')
          PY
      - name: Check first-boot shell syntax
        run: bash -n pi-image/printbench-firstboot.sh
