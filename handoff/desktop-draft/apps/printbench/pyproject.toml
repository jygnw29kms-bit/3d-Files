[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "printbench-control"
version = "0.1.0"
description = "Local P2S/AMS control with OrcaSlicer and optional webspace mirror"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "paho-mqtt==2.1.0", "requests>=2.32", "keyring>=25,<26"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
printbench = "printbench_app.launcher:main"

[tool.setuptools.package-data]
printbench_app = ["web/*"]
